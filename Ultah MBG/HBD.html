<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HBD Sayangku</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"
  />
</head>
<body style="background-image: url('https://i.pinimg.com/originals/ff/83/b2/ff83b2b675e037533c4aea5d0f4342e7.jpg');
    background-size: cover;
    background-position: center center;
    background-repeat: no-repeat;
" class="flex justify-center h-screen items-center">
    <div class="bg-white border px-10 py-8 border-4 border-pink-300
    shadow-lg shadow-pink-300 rounded-xl text-center animate__animated animate__backInDown m-8 w-80" id="kartu">
        <h1 class="text-3xl">Happy Birthday</h1>
        <h1 class="text-4xl text-pink-500 font-bold animate__animated animate__pulse animate__infinite">Dini Ariani</h1>
        <button class="p-2 bg-pink-600 text-white rounded mt-5 hover:bg-pink-900 transition ease-in w-full animate__animated animate__delay-2s animate__tada" onclick="ubahKartu()">Klik Disini ayy</button
        >
    </div>
   
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <script>
        window.addEventListener("DOMContentLoaded", () => {
            const duration = 3000;
            const animationEnd = Date.now() + duration;
            const defaults = {
                startVelocity: 30,
                spread: 360,
                ticks: 60,
                zIndex: 9999,
            };

            function randomInRange(min, max) {
                return Math.random() * (max - min) + min;
            }

            const interval = setInterval(() => {
                const timeLeft = animationEnd - Date.now();
                if (timeLeft <= 0) {
                    clearInterval(interval);
                    return;
                }

                const particleCount = Math.max(10, Math.floor(50 * (timeLeft / duration)));

                confetti(Object.assign({}, defaults, {
                    particleCount,
                    origin: { x: randomInRange(0.1, 0.3), y: Math.random() - 0.2 },
                }));

                confetti(Object.assign({}, defaults, {
                    particleCount,
                    origin: { x: randomInRange(0.7, 0.9), y: Math.random() - 0.2 },
                }));
            }, 250);
        });
        let kartu = document.getElementById("kartu");
        function ubahKartu() {
            kartu.innerHTML = `<h1 class="font-semibold text-wrap animate__animated animate__zoomIn">
        Selamat ulang tahun sayangku, semoga panjang umur, sehat selalu, dan dimudahkan segala urusannya.
        Banyakin Olahraga jangan rebahan mulu biar nambah tinggi hehe, Makannya juga dijaga jangan nunggu laper baru makan.
        Semoga semua cita-citanya tercapai dan selalu bahagia. LOPYU SEKEBON SAWIT <3
    </h1>
     <h2 class="mt-3 animate__animated animate__fadeIn">Dari: Pacarmu yang rada bolot ini hehe :*</h2>
    <button class="p-2 bg-pink-600 text-white rounded mt-5 hover:bg-pink-900 transition ease-in w-full animate__animated animate__delay-2s animate__tada" onclick="refresh()">Tutup</button
    >
    </div>
    `;
    }
      function refresh() {
            location.reload();
    }
    </script>
    <img src="gif/bokuto-haikyuu-hey-hey-hey.gif" class="absolute top-0 right-0 w-40 animate__animated animate__fadeIn" />
    <img src="gif/okok.gif" class="absolute bottom-0 left-0 w-40 animate__animated animate__fadeIn" />
    <img src="gif/ppp.gif" class="absolute bottom-0 right-0 w-40 animate__animated animate__fadeIn" />
    <img src="gif/asw.gif" class="absolute top-0 left-0 w-40 animate__animated animate__fadeIn" />            
</body>
</html>
